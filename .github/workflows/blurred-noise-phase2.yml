name: Phase 2 - independent blurred-noise images

# Image seed 1 was run separately (Actions run 43706330133).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-generalization:
    name: image ${{ matrix.image_seed }} / network ${{ matrix.ablation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        image_seed: [2, 3]
        ablation: [1, 3, 5, 6, 8]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install and record environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          mkdir -p metadata
          python -m pip freeze > metadata/pip-freeze.txt
          git rev-parse HEAD > metadata/commit.txt
          python - <<'PY' > metadata/environment.txt
          import platform, sys, numpy, torch
          print("python:", sys.version)
          print("platform:", platform.platform())
          print("numpy:", numpy.__version__)
          print("torch:", torch.__version__)
          print("cuda:", torch.cuda.is_available())
          PY
      - name: Run fixed 2000-step protocol
        shell: bash
        run: |
          set -euo pipefail
          python experiments/run_experiment.py \
            --image-type blurred_noise --blur-scale 4 \
            --ablation-id "${{ matrix.ablation }}" --channels 16 \
            --steps 2000 --image-seed "${{ matrix.image_seed }}" \
            --seed 0 --device cpu --output-dir outputs/phase2
          test -s "outputs/phase2/blurred_noise_scale_4_image_seed_${{ matrix.image_seed }}/ablation_${{ matrix.ablation }}/metrics.csv"
          test -s "outputs/phase2/blurred_noise_scale_4_image_seed_${{ matrix.image_seed }}/ablation_${{ matrix.ablation }}/selected_prediction.npy"
      - name: Validate finite metrics and summarize
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, math
          from pathlib import Path
          image_seed = ${{ matrix.image_seed }}
          ablation = ${{ matrix.ablation }}
          folder = Path(f"outputs/phase2/blurred_noise_scale_4_image_seed_{image_seed}/ablation_{ablation}")
          with (folder / "metrics.csv").open(newline="") as f:
              rows = list(csv.DictReader(f))
          assert rows and int(float(rows[-1]["step"])) == 2000
          for row in rows:
              for key in ("train_mse", "heldout_mse", "gap_mse"):
                  assert math.isfinite(float(row[key])), (key, row)
          selection = "heldout" if ablation in (1, 3, 5) else "final"
          selected = min(rows, key=lambda r: float(r["heldout_mse"])) if selection == "heldout" else rows[-1]
          summary = (f"image_seed={image_seed}\nmodel_seed=0\nablation={ablation}\n"
                     f"steps=2000\nselection={selection}\n"
                     f"selected_step={selected['step']}\ngap_mse={selected['gap_mse']}\n")
          (folder / "summary.txt").write_text(summary, encoding="utf-8")
          print(summary)
          PY
      - name: Upload metrics and predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-image-${{ matrix.image_seed }}-network-${{ matrix.ablation }}
          path: |
            outputs/phase2/**/metrics.csv
            outputs/phase2/**/selected_prediction.npy
            outputs/phase2/**/summary.txt
            metadata/*
          if-no-files-found: warn
          retention-days: 90
