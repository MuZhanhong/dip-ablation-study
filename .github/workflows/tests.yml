name: Tests and training smoke check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run data and baseline smoke test
        run: python experiments/run_smoke_test.py
      - name: Run official training entry point (CPU, 10 steps)
        run: |
          python experiments/run_experiment.py \
            --image-type gradient \
            --ablation-id 6 \
            --steps 10 \
            --channels 4 \
            --device cpu \
            --output-dir /tmp/dip-smoke-output
          test -s /tmp/dip-smoke-output/gradient/ablation_6/metrics.csv
          test -s /tmp/dip-smoke-output/gradient/ablation_6/best_prediction.npy
          test -s /tmp/dip-smoke-output/gradient/ablation_6/best_model_state.pt
