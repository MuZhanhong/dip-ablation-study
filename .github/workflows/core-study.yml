name: Core study - one blur scale

# Run one scale at a time. This uses the existing shared architectures until
# the replacement architecture list has been agreed by the team.
on:
  workflow_dispatch:
    inputs:
      blur_scale:
        description: "Blur scale for this batch"
        required: true
        type: choice
        options: ["2", "3", "4", "6"]
      steps:
        description: "Training steps per run"
        required: true
        default: "2000"
        type: string
      channels:
        description: "Channel width"
        required: true
        default: "16"
        type: string

permissions:
  contents: read

jobs:
  core:
    name: scale ${{ inputs.blur_scale }} / N${{ matrix.network }} / image ${{ matrix.image_seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        network: [1, 3, 5, 7]
        image_seed: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          mkdir -p metadata
          python -m pip freeze > metadata/requirements.txt
          git rev-parse HEAD > metadata/commit.txt
      - name: Train three model seeds
        shell: bash
        run: |
          set -euo pipefail
          for seed in 0 1 2; do
            python experiments/run_experiment.py \
              --image-type blurred_noise \
              --blur-scale "${{ inputs.blur_scale }}" \
              --ablation-id "${{ matrix.network }}" \
              --image-seed "${{ matrix.image_seed }}" \
              --seed "$seed" \
              --channels "${{ inputs.channels }}" \
              --steps "${{ inputs.steps }}" \
              --device cpu \
              --output-dir "outputs/model_seed_$seed"
          done
          test "$(find outputs -name selected_prediction.npy | wc -l)" -eq 3
          test "$(find outputs -name metrics.csv | wc -l)" -eq 3
      - name: Upload predictions and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-scale-${{ inputs.blur_scale }}-net-${{ matrix.network }}-image-${{ matrix.image_seed }}
          path: |
            outputs/**/metrics.csv
            outputs/**/selected_prediction.npy
            metadata/*
          if-no-files-found: warn
          retention-days: 90
