name: Sweep - extra arms (stripes, width, network 2 probe, contrast)

# Each arm answers one thread; launch them one at a time or all together.
on:
  workflow_dispatch:
    inputs:
      arm:
        description: "Which arm to run"
        type: choice
        options: ["stripes", "width", "network-2", "contrast", "all"]
        default: "stripes"

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  PYTHONHASHSEED: "0"

jobs:
  stripes:
    # Thread 2: pooling should do better on smooth images, 3x3 filters on stripes.
    if: ${{ inputs.arm == 'stripes' || inputs.arm == 'all' }}
    name: stripes period ${{ matrix.period }} net ${{ matrix.ablation }} seed ${{ matrix.model_seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        ablation: [1, 3, 5, 7]
        period: [4, 8, 16]
        model_seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch) and record environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          mkdir -p metadata
          python -m pip freeze > metadata/pip-freeze.txt
          git rev-parse HEAD > metadata/commit.txt
      - name: Train
        run: |
          python experiments/run_experiment.py \
            --image-type stripes --stripe-period ${{ matrix.period }} \
            --seed ${{ matrix.model_seed }} \
            --ablation-id ${{ matrix.ablation }} --channels 16 --steps 5000 \
            --save-prediction-every 250 \
            --save-weights-at $(seq -s, 0 500 5000) \
            --measure-kernel-at $(seq -s, 0 250 5000) \
            --device cpu --output-dir outputs/stripes/model_seed_${{ matrix.model_seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stripes-period${{ matrix.period }}-net${{ matrix.ablation }}-seed${{ matrix.model_seed }}
          path: |
            outputs/
            metadata/
          retention-days: 90

  width:
    # Width check at 64 channels: does the spread between seeds shrink, and does the
    # contrast between the two routes (3 = upsampling only, 5 = 3x3 only) survive
    # in a wider network, or is the learned part an effect of being narrow?
    if: ${{ inputs.arm == 'width' || inputs.arm == 'all' }}
    name: width 64 net ${{ matrix.ablation }} image ${{ matrix.image_seed }} seed ${{ matrix.model_seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        ablation: [1, 3, 5]
        image_seed: [1, 2, 3, 4]
        model_seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch) and record environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          mkdir -p metadata
          python -m pip freeze > metadata/pip-freeze.txt
          git rev-parse HEAD > metadata/commit.txt
      - name: Train
        run: |
          python experiments/run_experiment.py \
            --image-type blurred_noise --blur-scale 4 \
            --image-seed ${{ matrix.image_seed }} --seed ${{ matrix.model_seed }} \
            --ablation-id ${{ matrix.ablation }} --channels 64 --steps 5000 \
            --save-prediction-every 250 \
            --save-weights-at $(seq -s, 0 500 5000) \
            --measure-kernel-at $(seq -s, 0 500 5000) \
            --device cpu --output-dir outputs/width64/model_seed_${{ matrix.model_seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: width64-net${{ matrix.ablation }}-image${{ matrix.image_seed }}-seed${{ matrix.model_seed }}
          path: |
            outputs/
            metadata/
          retention-days: 90

  width-l2:
    # Network 5 at 64 channels on l = 2 as well as l = 4, so "the width follows l"
    # can be checked in a wide network, not only "it ends near the image width".
    # Launched with the width arm. About 12 minutes per run on a laptop.
    if: ${{ inputs.arm == 'width' || inputs.arm == 'all' }}
    name: width 64 l=2 net 5 image ${{ matrix.image_seed }} seed ${{ matrix.model_seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        image_seed: [1, 2, 3, 4]
        model_seed: [0, 1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch) and record environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          mkdir -p metadata
          python -m pip freeze > metadata/pip-freeze.txt
          git rev-parse HEAD > metadata/commit.txt
      - name: Train
        run: |
          python experiments/run_experiment.py \
            --image-type blurred_noise --blur-scale 2 \
            --image-seed ${{ matrix.image_seed }} --seed ${{ matrix.model_seed }} \
            --ablation-id 5 --channels 64 --steps 5000 \
            --save-prediction-every 250 \
            --save-weights-at $(seq -s, 0 500 5000) \
            --measure-kernel-at $(seq -s, 0 500 5000) \
            --device cpu --output-dir outputs/width64/model_seed_${{ matrix.model_seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: width64-l2-net5-image${{ matrix.image_seed }}-seed${{ matrix.model_seed }}
          path: |
            outputs/
            metadata/
          retention-days: 90

  network-2:
    # Linear probe: network 2 is unshared but has a route (upsampling + 3x3). Does
    # useful information reach the gap and go unread, or does nothing arrive?
    # Features entering the final layers are saved; weights (120 MB) are not.
    # About 30 minutes per run on a laptop.
    if: ${{ inputs.arm == 'network-2' || inputs.arm == 'all' }}
    name: net 2 image ${{ matrix.image_seed }} seed ${{ matrix.model_seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        image_seed: [1, 2, 3, 4]
        model_seed: [0]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch) and record environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          mkdir -p metadata
          python -m pip freeze > metadata/pip-freeze.txt
          git rev-parse HEAD > metadata/commit.txt
      - name: Train
        run: |
          python experiments/run_experiment.py \
            --image-type blurred_noise --blur-scale 4 \
            --image-seed ${{ matrix.image_seed }} --seed ${{ matrix.model_seed }} \
            --ablation-id 2 --channels 16 --steps 5000 \
            --save-prediction-every 250 --no-model-states --save-features \
            --device cpu --output-dir outputs/network2/model_seed_${{ matrix.model_seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network2-image${{ matrix.image_seed }}-seed${{ matrix.model_seed }}
          path: |
            outputs/
            metadata/
          retention-days: 90

  contrast:
    # Unshared gap noise (s_o^2): in network 8 it is loud when visible pixels sit close
    # to 0.5 and quiet when they sit far from it, switching between a typical distance
    # of 0.12 and 0.16. Every core image is at about 0.08 (all loud), so this arm moves
    # one image across the switch: contrast 0.5, 1, 1.5, 2, 3 = distance about
    # 0.04, 0.08, 0.12, 0.16, 0.24 (at 3 about a tenth of pixels clip at 0 or 1).
    if: ${{ inputs.arm == 'contrast' || inputs.arm == 'all' }}
    name: contrast ${{ matrix.contrast }} net 8 seed ${{ matrix.model_seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        contrast: [0.5, 1.0, 1.5, 2.0, 3.0]
        model_seed: [0, 1]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch) and record environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          mkdir -p metadata
          python -m pip freeze > metadata/pip-freeze.txt
          git rev-parse HEAD > metadata/commit.txt
      - name: Train
        run: |
          python experiments/run_experiment.py \
            --image-type blurred_noise --blur-scale 4 --image-seed 1 \
            --contrast ${{ matrix.contrast }} --seed ${{ matrix.model_seed }} \
            --ablation-id 8 --channels 16 --steps 5000 \
            --save-prediction-every 250 --no-model-states \
            --device cpu --output-dir outputs/contrast/model_seed_${{ matrix.model_seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contrast${{ matrix.contrast }}-net8-seed${{ matrix.model_seed }}
          path: |
            outputs/
            metadata/
          retention-days: 90