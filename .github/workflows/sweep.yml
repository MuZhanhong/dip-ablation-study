name: Main sweep (one image, 8 networks x 5 seeds)

# Manual only. Start once per image: 40 jobs (8 networks x 5 seeds), one run each.
# Shared networks are scored at the held-out-selected step, unshared at the final step
# (see experiments/config.yaml).
on:
  workflow_dispatch:
    inputs:
      image_type:
        description: "gradient, blurred_noise or stripes"
        required: true
        type: choice
        options: [gradient, blurred_noise, stripes]
      blur_scale:
        description: "Blur scale (blurred_noise only; ignored otherwise)"
        required: false
        default: "4"
      channels:
        description: "Channel width"
        required: true
        default: "16"
      steps:
        description: "Training steps"
        required: true
        default: "2000"

permissions:
  contents: read

jobs:
  train:
    name: ${{ inputs.image_type }} / net ${{ matrix.ablation }} / seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        ablation: [1, 2, 3, 4, 5, 6, 7, 8]
        seed: [0, 1, 2, 3, 4]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run experiment
        shell: bash
        run: |
          set -euo pipefail
          out="/tmp/dip-sweep/run"
          mkdir -p "$out"
          blur_args=()
          if [ "${{ inputs.image_type }}" = "blurred_noise" ]; then
            blur_args=(--blur-scale "${{ inputs.blur_scale }}")
          fi
          /usr/bin/time -v -o "$out/resource_usage.txt" \
            python experiments/run_experiment.py \
              --image-type "${{ inputs.image_type }}" "${blur_args[@]}" \
              --ablation-id "${{ matrix.ablation }}" \
              --steps "${{ inputs.steps }}" \
              --channels "${{ inputs.channels }}" \
              --seed "${{ matrix.seed }}" \
              --device cpu \
              --output-dir "$out/output" 2>&1 | tee "$out/training.log"
          test -n "$(find "$out/output" -name metrics.csv -size +0)"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ inputs.image_type }}-${{ inputs.image_type == 'blurred_noise' && inputs.blur_scale || 'na' }}-c${{ inputs.channels }}-s${{ inputs.steps }}-net${{ matrix.ablation }}-seed${{ matrix.seed }}
          path: /tmp/dip-sweep/run
          if-no-files-found: error
          retention-days: 90
